# Plant status for the Third Reality 3RSM0147Z soil sensors (ZHA), built only from native
# template entities. Each plant gets a status sensor and a needs-water binary sensor, both
# with a unique_id so name, icon and area can be set in the UI.
#
# Thresholds come from the Xiaomi Flower Care plant database
# (https://github.com/khronimo/MiFloraDB, PlantDB_5335_U0.csv, min/max_soil_moist and
# min/max_temp per species). That database is coarse (almost every species is 15-60
# moisture) and was measured with Xiaomi sensors, so the Third Reality scale may differ.
# Hydrangea macrophylla is not listed by name; all Hydrangea entries are identical (20-60).
# Below the moisture minimum means water thoroughly; above the maximum means too wet (a few
# hours right after watering can briefly read above it). Temperature limits are set for the
# indoor plants only: the garden plants are hardy, so a fixed minimum would sit in a problem
# state all winter. Battery minimum is 20% for all. The sensor's own "moisture" entity is
# disabled because it duplicates "soil moisture", so everything reads _soil_moisture.
#
# Status priority: needs water, too wet, too cold, too hot, battery low, ok. The status
# sensor is unavailable while the soil moisture sensor is unavailable.

template:

  # Yucca
  - sensor:
      - name: "Yucca Status"
        unique_id: plant_yucca_status
        availability: "{{ has_value('sensor.yucca_soil_moisture') }}"
        state: >
          {% set m = states('sensor.yucca_soil_moisture') | float(none) %}
          {% set t = states('sensor.yucca_temperature') | float(none) %}
          {% set b = states('sensor.yucca_battery') | float(none) %}
          {% if m is none %}
            unknown
          {% elif m < 15 %}
            needs water
          {% elif m > 60 %}
            too wet
          {% elif t is not none and t < 8 %}
            too cold
          {% elif t is not none and t > 32 %}
            too hot
          {% elif b is not none and b < 20 %}
            battery low
          {% else %}
            ok
          {% endif %}
        icon: >
          {% set s = this.state %}
          {% if s == 'ok' %}mdi:flower
          {% elif s == 'needs water' %}mdi:watering-can
          {% elif s == 'too wet' %}mdi:water-alert
          {% elif s == 'battery low' %}mdi:battery-alert
          {% elif s in ['too cold', 'too hot'] %}mdi:thermometer-alert
          {% else %}mdi:flower-outline{% endif %}
        attributes:
          moisture: "{{ states('sensor.yucca_soil_moisture') | float(none) }}"
          moisture_min: 15
          moisture_max: 60
          temperature: "{{ states('sensor.yucca_temperature') | float(none) }}"
          temperature_min: 8
          temperature_max: 32
          battery: "{{ states('sensor.yucca_battery') | float(none) }}"
          battery_min: 20
  - binary_sensor:
      - name: "Yucca Needs Water"
        unique_id: plant_yucca_needs_water
        availability: "{{ has_value('sensor.yucca_soil_moisture') }}"
        state: "{{ states('sensor.yucca_soil_moisture') | float(100) < 15 }}"
        icon: mdi:watering-can

